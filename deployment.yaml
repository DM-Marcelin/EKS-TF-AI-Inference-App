apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference-deployment
  labels:
    app: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-inference
  template:
    metadata:
      labels:
        app: ai-inference
    spec:
      containers:
        - name: ai-inference-container
          image: 007160697038.dkr.ecr.us-east-1.amazonaws.com/ai-inference-app:latest
          ports:
            - containerPort: 5000

            # Kubernetes Deployment for AI Inference App
# Image: Pushed to Amazon ECR
